[tools]
node = "24"

[tasks.install]
description = "Install dependencies"
run = "npm ci"

[tasks.dev]
description = "Start the dev server"
run = "npm run dev"

[tasks.check]
description = "Type-check Svelte and TypeScript"
run = "npm run check"

[tasks.test]
description = "Run unit tests (set MIHON_BACKUP to also round-trip a real backup)"
run = "npm test"

[tasks.build]
description = "Build the static site into build/"
run = "npm run build"

[tasks.preview]
description = "Serve the production build"
run = "npm run preview"

[tasks.ci]
description = "Everything the deploy workflow runs before publishing"
depends = ["check", "test"]
run = "npm run build"
